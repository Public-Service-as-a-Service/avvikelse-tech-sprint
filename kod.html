<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Åtkomstkod · Säkerhetskrav K3 · Sundsvalls kommun</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --navy: #14304d;
    --navy-deep: #0c2036;
    --accent: #a12d26;
    --text: #22303f;
    --dim: #55657a;
    --border: #d5dce5;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    background: var(--navy-deep); font-family: var(--sans); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .strip {
    background: var(--accent); color: #fff;
    font-family: var(--mono); font-size: 11.5px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    text-align: center; padding: 7px 16px;
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 12px;
    border-top: 4px solid var(--accent);
    padding: 36px 34px 32px; text-align: center;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }
  .card > svg { width: 52px; height: 52px; margin-bottom: 16px; }
  h1 { font-family: var(--serif); font-size: 1.45rem; color: var(--navy); margin-bottom: 8px; }
  p.info { font-size: 0.92rem; color: var(--dim); line-height: 1.55; margin-bottom: 22px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input {
    font-family: var(--mono); font-size: 1.05rem; letter-spacing: 0.08em; text-align: center;
    padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px;
    outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: var(--navy); }
  button {
    font-family: var(--sans); font-size: 0.98rem; font-weight: 700; color: #fff;
    background: var(--navy); border: none; border-radius: 8px; padding: 12px 14px;
    cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: #1d4066; }
  .fel {
    display: none; margin-top: 14px; font-size: 0.88rem; color: var(--accent);
    background: #f7ebea; border: 1px solid #e4c1be; border-radius: 8px; padding: 10px 12px;
  }
  .fel.visa { display: block; }
  footer { text-align: center; padding: 18px; font-size: 0.8rem; color: #7d92a8; font-family: var(--mono); }
</style>
</head>
<body>
<div class="strip">Begränsad åtkomst · Sundsvalls kommun</div>
<main>
  <div class="card">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="#14304d"/><rect x="9" y="10.4" width="6" height="5" rx="1" fill="#fff"/><path d="M10.2 10.4V9a1.8 1.8 0 1 1 3.6 0v1.4" stroke="#fff" stroke-width="1.4" fill="none"/></svg>
    <h1>Säkerhetskrav K3</h1>
    <p class="info">
      Sidan innehåller kommunens säkerhetskrav för K3-klassad information inom
      VOF/IAF och kräver en åtkomstkod. Koden får du av teamet.
    </p>
    <form id="kodform" autocomplete="off">
      <input type="password" id="kod" placeholder="Åtkomstkod" autofocus required>
      <button type="submit">Lås upp</button>
    </form>
    <p class="fel" id="fel">Fel kod — försök igen eller kontakta teamet.</p>
  </div>
</main>
<footer>VOF/IAF · Sundsvalls kommun</footer>
<script>
(function () {
  var fel = document.getElementById('fel');

  // Skickades vi tillbaka hit efter ett försök var koden fel.
  if (sessionStorage.getItem('sakkod-forsok')) {
    sessionStorage.removeItem('sakkod-forsok');
    fel.classList.add('visa');
  }

  document.getElementById('kodform').addEventListener('submit', function (e) {
    e.preventDefault();
    var kod = document.getElementById('kod').value.trim();
    if (!kod) return;
    // Koden sparas som sessionscookie och kontrolleras server-side av nginx.
    document.cookie = 'sakkod=' + encodeURIComponent(kod) + '; path=/; SameSite=Strict';
    sessionStorage.setItem('sakkod-forsok', '1');
    window.location.href = 'sakerhetskrav.html';
  });
})();
</script>
</body>
</html>
